
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Student</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6f9;
            min-height: 100vh;
        }

        .header {
            background: #1e3a8a;
            color: white;
            padding: 20px 30px;
        }

        .header h1 {
            font-size: 28px;
        }

        .container {
            max-width: 650px;
            margin: 40px auto;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        h2 {
            color: #1e3a8a;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #1e3a8a;
        }

        .buttons {
            display: flex;
            gap: 12px;
            margin-top: 25px;
        }

        button {
            flex: 1;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #1e3a8a;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #162d6b;
        }

        .back-btn {
            flex: 1;
            padding: 13px;
            text-align: center;
            border-radius: 8px;
            background: #e5e7eb;
            color: #333;
            text-decoration: none;
        }

        .back-btn:hover {
            background: #d1d5db;
        }

        .note {
            background: #eff6ff;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 25px;
            color: #1e3a8a;
            font-size: 14px;
        }

        @media (max-width: 600px) {
            .container {
                margin: 20px;
                padding: 25px;
            }

            .buttons {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>📚 College Library Management System</h1>
    </div>

    <div class="container">

        <h2>👨‍🎓 Add Student</h2>

        <div class="note">
            Enter the student's details below.
        </div>

        <form method="POST" action="/add-student">

            <div class="form-group">
                <label for="roll_no">Roll Number</label>

                <input
                    type="text"
                    id="roll_no"
                    name="roll_no"
                    placeholder="Example: 23A91A0501"
                    required
                >
            </div>

            <div class="form-group">
                <label for="name">Student Name</label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter student name"
                    required
                >
            </div>

            <div class="form-group">
                <label for="branch">Branch</label>

                <select id="branch" name="branch">

                    <option value="">Select Branch</option>

                    <option value="CSE">CSE</option>
                    <option value="CSE (AI)">CSE (AI)</option>
                    <option value="CSE (DS)">CSE (DS)</option>
                    <option value="ECE">ECE</option>
                    <option value="EEE">EEE</option>
                    <option value="MECH">MECH</option>
                    <option value="CIVIL">CIVIL</option>
                    <option value="Other">Other</option>

                </select>
            </div>

            <div class="form-group">
                <label for="year">Year</label>

                <select id="year" name="year">

                    <option value="">Select Year</option>

                    <option value="1st Year">1st Year</option>
                    <option value="2nd Year">2nd Year</option>
                    <option value="3rd Year">3rd Year</option>
                    <option value="4th Year">4th Year</option>

                </select>
            </div>

            <div class="form-group">
                <label for="phone">Phone Number</label>

                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    placeholder="Enter phone number"
                    maxlength="10"
                >
            </div>

            <div class="buttons">

                <a href="/students" class="back-btn">
                    ← Back
                </a>

                <button type="submit">
                    👨‍🎓 Add Student
                </button>

            </div>

        </form>

    </div>

</body>
</html>
